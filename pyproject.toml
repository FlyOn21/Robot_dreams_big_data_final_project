[project]
name = "bd-robot-dreams-final-project"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "apache-airflow-providers-apache-spark==4.8.2",
    "apache-airflow-providers-postgres==5.11.2",
    "dbt-core>=1.10.13",
    "dbt-postgres>=1.9.1",
    "factory-boy==3.3.3",
    "faker==37.6.0",
    "kafka-python>=2.2.15",
    "pandas>=2.3.2",
    "pyspark==3.5.2",
    "python-snappy>=0.7.3",
]

[dependency-groups]
dev = [
    "ruff>=0.13.2",
]

[tool.ruff]
line-length = 120
target-version = "py312"
output-format = "concise"
exclude = [
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    ".venv",
    "_build",
    ".venv",
]

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
    "N", # pep8-naming
    "UP", # pyupgrade
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
]
ignore = ["F401",
    "E501",
    "E101",
    "E402",
    "F403", # do not use wildcard imports
    "F405",
    "F821",
    "UP035",
    "B008", # do not perform function calls in argument defaults
    "B904", # raise without from inside except
    "B006", # ignore defoult mitable array use
    "W191", # indentation contains tabs (conflicts with format.indent-style="tab")
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
known-first-party = ["app"]
split-on-trailing-comma = true

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true
ignore_missing_imports = true
exclude = [".venv", "tests", ".databricks"]
