          - name: hash_row
            description: "Hash of row for deduplication"

          - name: load_timestamp
            description: "Timestamp when record was loaded"
            tests:
              - not_null

          - name: source_file
            description: "Source file name"

      - name: silver_arrests
        description: "Silver layer arrest stream records data"
        columns:
