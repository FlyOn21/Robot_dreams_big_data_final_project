version: 2

sources:
  - name: silver
    description: "Silver layer tables containing cleaned and standardized data"
    schema: silver
    database: "{{ target.database }}"

    tables:
      - name: silver_ucr_codes
        description: "Silver layer UCR codes reference data"
        columns:
          - name: iucr_code
            description: "Illinois Uniform Crime Reporting code"
            tests:
              - unique
              - not_null

          - name: primary_description
            description: "Primary classification of crime type"

          - name: secondary_description
            description: "Secondary/detailed classification"

          - name: index_code
            description: "FBI Index Crime indicator"

          - name: is_active
            description: "Whether this UCR code is currently in use"

          - name: load_timestamp
            description: "Timestamp when record was loaded"
            tests:
              - not_null

      - name: silver_crimes
        description: "Silver layer crime incidents data"
        columns:
          - name: crime_id
            description: "Unique identifier for each crime"
            tests:
              - unique
              - not_null

          - name: case_number
            description: "Chicago Police Department case number"
            tests:
              - not_null

          - name: iucr_code
            description: "Illinois Uniform Crime Reporting code"

          - name: fbi_code
            description: "FBI crime classification code"

          - name: crime_datetime
            description: "Date and time of crime occurrence"
            tests:
              - not_null

          - name: crime_date
            description: "Date of crime (without time component)"

          - name: primary_type
            description: "Primary crime type classification"

          - name: description
            description: "Detailed description of the crime"

          - name: block
            description: "Block address where crime occurred"

          - name: location_description
            description: "Description of the location"

          - name: location_full_text
            description: "Full text location details"

          - name: beat_id
            description: "Police beat identifier"

          - name: district_id
            description: "Police district identifier"

          - name: ward_id
            description: "Ward identifier"

          - name: community_area_id
            description: "Community area identifier"

          - name: latitude
            description: "Latitude coordinate"

          - name: longitude
            description: "Longitude coordinate"

          - name: x_coordinate
            description: "X coordinate (State Plane)"

          - name: y_coordinate
            description: "Y coordinate (State Plane)"

          - name: location_geo_point
            description: "Geospatial point"

          - name: is_arrest
            description: "Whether an arrest was made"

          - name: is_domestic
            description: "Whether crime was domestic-related"

          - name: hash_row
            description: "Hash of row for deduplication"

          - name: load_timestamp
            description: "Timestamp when record was loaded"
            tests:
              - not_null

          - name: source_file
            description: "Source file name"

      - name: silver_crimes_stream
        description: "Silver layer crime stream incidents data"
        columns:
          - name: crime_id
            description: "Unique identifier for each crime"
            tests:
              - unique
              - not_null

